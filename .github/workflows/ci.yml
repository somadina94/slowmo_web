# =============================================================================
# Slow Mo Web — build on GitHub (GHCR), deploy with SSH password
# =============================================================================
#
# Secrets (Settings → Secrets):
#   SERVER_HOST            — deploy host
#   SERVER_USERNAME        — SSH user
#   SERVER_PASSWORD        — SSH password (not an SSH key)
#   SERVER_PORT            — optional, default 22
#   SERVER_DEPLOY_PATH     — optional, default /root/slowmo-web
#   PAT_TOKEN              — optional GitHub PAT for git pull on the server
#   VITE_RAZORPAY_KEY_ID   — live/test Razorpay key baked into the image
#   GHCR_USERNAME          — optional; defaults to github.actor
#   GHCR_TOKEN             — optional PAT (read:packages) for server pulls;
#                            CI push uses GITHUB_TOKEN automatically
#
# Variables (Settings → Variables — NOT Secrets):
#   VITE_API_BASE_URL      — e.g. https://api.slowmo.co/api/v1
#   WEB_PORT               — optional host port published by compose (default 5011)
#   API_PORT               — optional; used only for local fallback API URL
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
  WEB_PORT: ${{ vars.WEB_PORT || '5011' }}
  API_PORT: ${{ vars.API_PORT || '5012' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Ensure brand assets are real files
        run: |
          test -s public/assets/slowmo-pouch.png
          test -s public/assets/slowmo-logo.png
          if head -c 20 public/assets/slowmo-pouch.png | grep -q 'git-lfs'; then
            echo "LFS pointer checked out instead of image bytes"
            exit 1
          fi

      - name: Resolve API URL
        id: api_url
        run: |
          URL="${{ vars.VITE_API_BASE_URL }}"
          if [ -z "$URL" ]; then
            URL="http://127.0.0.1:${API_PORT}/api/v1"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Baking VITE_API_BASE_URL=$URL"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify web
        run: npm run verify

      - name: Validate Docker Compose (prod)
        run: |
          cp .env.prod.example .env
          echo "SLOWMO_WEB_IMAGE=slowmo-web:test" >> .env
          echo "VITE_API_BASE_URL=${{ steps.api_url.outputs.url }}" >> .env
          echo "WEB_PORT=${WEB_PORT}" >> .env
          docker compose -f docker-compose.prod.yml --env-file .env config

      - name: Build web image
        run: |
          docker build -t slowmo-web:test \
            --build-arg VITE_API_BASE_URL="${{ steps.api_url.outputs.url }}" \
            --build-arg VITE_RAZORPAY_KEY_ID="${{ secrets.VITE_RAZORPAY_KEY_ID }}" \
            --build-arg VITE_APP_ENV=prod \
            .

      - name: Ensure deploy script is executable
        run: |
          chmod +x deploy.sh
          test -x deploy.sh

  push-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Resolve API URL
        id: api_url
        run: |
          URL="${{ vars.VITE_API_BASE_URL }}"
          if [ -z "$URL" ]; then
            URL="http://127.0.0.1:${API_PORT}/api/v1"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.api_url.outputs.url }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
            VITE_APP_ENV=prod
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: slowmo-web-prod-deploy
      cancel-in-progress: false
    steps:
      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/root/slowmo-web"
            fi

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Deploy directory not found: $DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
              git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git checkout "${{ github.ref_name }}"
              git reset --hard "origin/${{ github.ref_name }}"
              git clean -fd
            fi

            chmod +x ./deploy.sh

            echo "Logging in to ghcr.io..."
            if docker info >/dev/null 2>&1; then
              echo "${{ env.GHCR_TOKEN }}" | docker login ghcr.io \
                -u "${{ env.GHCR_USERNAME }}" \
                --password-stdin
            else
              echo "${{ env.GHCR_TOKEN }}" | sudo docker login ghcr.io \
                -u "${{ env.GHCR_USERNAME }}" \
                --password-stdin
            fi

            export DEPLOY_BUILD_LOCAL=0
            export SLOWMO_WEB_IMAGE="${{ steps.image.outputs.name }}:latest"

            if [ ! -f .env ]; then
              echo "Missing .env on server at $DEPLOY_PATH — create it from .env.prod.example first."
              exit 1
            fi

            if grep -q '^SLOWMO_WEB_IMAGE=' .env 2>/dev/null; then
              sed -i.bak "s|^SLOWMO_WEB_IMAGE=.*|SLOWMO_WEB_IMAGE=${SLOWMO_WEB_IMAGE}|" .env
            else
              echo "SLOWMO_WEB_IMAGE=${SLOWMO_WEB_IMAGE}" >> .env
            fi

            if grep -q '^WEB_PORT=' .env 2>/dev/null; then
              sed -i.bak "s|^WEB_PORT=.*|WEB_PORT=${{ env.WEB_PORT }}|" .env
            else
              echo "WEB_PORT=${{ env.WEB_PORT }}" >> .env
            fi

            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              if grep -q '^GHCR_USERNAME=' .env 2>/dev/null; then
                sed -i.bak "s|^GHCR_USERNAME=.*|GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}|" .env
              else
                echo "GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}" >> .env
              fi
              if grep -q '^GHCR_TOKEN=' .env 2>/dev/null; then
                sed -i.bak "s|^GHCR_TOKEN=.*|GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}|" .env
              else
                echo "GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}" >> .env
              fi
            fi

            rm -f .env.bak

            docker rm -f slowmo-web-prod || true
            ./deploy.sh
